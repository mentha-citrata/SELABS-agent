<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SELABS Agent — 最小前端原型</title>
    <style>
      body{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;max-width:900px;margin:24px auto;color:#111}
      .chat{border:1px solid #e5e7eb;border-radius:8px;padding:12px}
      .messages{height:360px;overflow:auto;padding:8px;background:#fff;border-radius:6px;border:1px solid #f3f4f6}
      .msg{margin:6px 0;padding:8px;border-radius:6px}
      .user{background:#eef2ff;text-align:right}
      .assistant{background:#f1f5f9}
      .controls{display:flex;gap:8px;margin-top:8px}
      input[type=text]{flex:1;padding:8px;border:1px solid #d1d5db;border-radius:6px}
      button{padding:8px 12px;border-radius:6px;background:#2563eb;color:#fff;border:none}
      .status{margin-top:8px;font-size:13px;color:#6b7280}
    </style>
  </head>
  <body>
    <h2>SELABS Agent — 最小前端原型（SSE）</h2>

    <div class="chat">
      <div id="messages" class="messages"></div>

      <div class="controls">
        <input id="input" type="text" placeholder="输入你的问题，然后回车或点击发送" />
        <button id="send">发送</button>
      </div>

      <div class="status" id="status">未连接</div>
    </div>

    <script src="/chat.js"></script>
  </body>
</html>
